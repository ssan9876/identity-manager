# Continuous integration.
#
# This workflow is LIVE as of 2026-08-08: the repository now has a remote
# (github.com/ssan9876/identity-manager) and master has been pushed, so every
# run below executes for real. `pnpm verify` (this workflow's centerpiece, via
# the "Verify" step) is the same gate that runs locally, plus the one thing
# local `verify` deliberately skips: the Playwright E2E suite, which needs the
# full compose stack and a running dev server, not just Testcontainers.
#
# GitHub-hosted `ubuntu-latest` runners provide a working Docker daemon out of
# the box, so both Testcontainers (inside `pnpm verify`'s API suite) and this
# repo's own `docker compose` stack work here unmodified — no dind service,
# no extra setup.
#
# Every step below runs to completion or fails the job — nothing here uses
# `continue-on-error`. A job that cannot start its services is a failure, not
# a skip.
name: CI

on:
  push:
  pull_request:

# Finding CS-M5 (docs/archive/audits/audit-client-supply-chain.md). Without
# this block GITHUB_TOKEN gets the repository default, which can be read/write
# across contents, packages, actions, issues and pull-requests. This job only
# typechecks, builds and tests: it needs to read the repo and nothing else.
# `on: pull_request` (not pull_request_target) is deliberate and correct —
# fork PRs run with no access to secrets. Keep it that way.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Configuration is EXPLICIT here rather than inherited from a `.env` that
    # `setup:all` copies as a side effect.
    #
    # Relying on that copy is what broke this workflow the first time it ever
    # ran for real: `setup:all` exited early during the Keycloak wait — before
    # the step that writes `.env` — yet reported success, so `bootstrap:admin`
    # failed with six "Required" errors that pointed nowhere near the cause.
    # `setup.mjs` can no longer exit silently, but CI should not depend on a
    # file appearing as a side effect of another command in the first place.
    #
    # These are the DEVELOPMENT values from `.env.example`, matching the
    # throwaway Compose stack this job starts. Nothing here is a secret: the
    # stack is created and destroyed inside this runner, and the same values
    # are committed in `.env.example` and in the dev realm import.
    env:
      DATABASE_URL: postgres://idm:idm_dev_password@localhost:5432/identity_manager
      RUNTIME_DATABASE_URL: postgres://idm_app:idm_app_dev_password@localhost:5432/identity_manager
      KEYCLOAK_ISSUER: http://localhost:8080/realms/identity-manager
      KEYCLOAK_AUDIENCE: idm-api
      KEYCLOAK_ADMIN_CLIENT_ID: idm-sync-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: idm_sync_dev_secret_change_me
      PORT: '3000'
      SYNC_WORKER_ENABLED: 'true'
      DB_POOL_MAX: '10'
      # Connector secrets must be named CONNECTOR_* — see connectors/secrets.ts.
      CONNECTOR_ECHO_CREDENTIAL: dev_echo_secret_change_me

    steps:
      # Actions are pinned by commit SHA, not by tag: a tag is a movable
      # pointer, so `@v4` runs whatever that tag points at today — compromise
      # the action's repo or a maintainer account and this workflow silently
      # changes. The trailing comment records the human-readable version each
      # SHA corresponds to; bump both together (CS-M5).
      #
      # persist-credentials: false because checkout otherwise leaves
      # GITHUB_TOKEN in .git/config for the rest of the job, and
      # `pnpm install --frozen-lockfile` below runs dependency lifecycle
      # scripts in that same directory (CS-H1). Nothing here pushes, so the
      # credential has no reason to outlive the checkout step.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Must run before actions/setup-node's `cache: pnpm` below, which shells
      # out to `pnpm store path` to find what to cache.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      # The contract-required, explicit frozen install: fails loudly if
      # pnpm-lock.yaml and any package.json have drifted apart, rather than
      # silently rewriting the lockfile mid-CI-run.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Playwright's own recommended CI caching split: OS-level shared
      # libraries (apt packages) are never persisted by actions/cache (this
      # runner's filesystem is thrown away after the job regardless), so
      # `install-deps` always runs; only the browser binary download itself
      # — the slow part — is skipped on a cache hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright OS dependencies
        run: pnpm --filter @idm/web exec playwright install-deps chromium

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @idm/web exec playwright install chromium

      # Deliberately NOT `pnpm setup:all`.
      #
      # That script is a developer-convenience wrapper for a fresh clone: it
      # runs preflight checks, seeds `.env` from `.env.example`, and re-runs
      # `pnpm install`. CI needs none of that — it configures itself through
      # the `env:` block above, and installed dependencies two steps ago.
      #
      # It was also the thing breaking every run: setup.mjs exited during its
      # Keycloak readiness poll with neither a result nor an error, 55ms into
      # a wait whose own timeout is 120 SECONDS — so this was never Keycloak
      # being slow, and raising a timeout would not have touched it. The
      # readiness poll below uses curl in a plain bash loop instead: fewer
      # moving parts, and when it fails it says so and dumps the container
      # logs rather than vanishing.
      #
      # setup.mjs keeps its own guard so a human gets a loud failure too, but
      # CI should not depend on a convenience script's internals either way.
      - name: Start Postgres + Keycloak
        run: docker compose up -d

      - name: Wait for Postgres and Keycloak to be ready
        run: |
          set -euo pipefail

          echo "waiting for Postgres ..."
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U idm >/dev/null 2>&1; then
              echo "Postgres is ready."; break
            fi
            [ "$i" -eq 60 ] && { echo "::error::Postgres never became ready"; docker compose logs postgres; exit 1; }
            sleep 2
          done

          # Keycloak is cold-starting a realm import here, so this is the slow
          # one. 120 attempts x 2s = 4 minutes, well beyond the 20-40s it
          # normally takes, because a CI runner under load is not a laptop.
          echo "waiting for Keycloak realm discovery ..."
          URL=http://localhost:8080/realms/identity-manager/.well-known/openid-configuration
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL" || echo 000)
            if [ "$code" = "200" ]; then echo "Keycloak is ready."; break; fi
            if [ "$i" -eq 120 ]; then
              echo "::error::Keycloak never answered realm discovery (last HTTP $code)"
              docker compose logs keycloak | tail -80
              exit 1
            fi
            [ $((i % 15)) -eq 0 ] && echo "  ... still waiting (HTTP $code, attempt $i/120)"
            sleep 2
          done

      - name: Apply migrations and provision the runtime role
        run: pnpm --filter @idm/api db:migrate

      # Vite reads `.env` from its OWN project directory, never the repo root,
      # and inlines VITE_* at build time — the job-level `env:` block above
      # does NOT reach it. `setup:all` used to seed this file, so removing that
      # step silently broke the E2E login: `authority` became undefined,
      # oidc-client-ts could not load discovery, and every spec timed out on
      # `waitForURL(/openid-connect\/auth/)` having never left the app.
      #
      # Written explicitly here for the same reason the API's config is: CI
      # should state what it depends on rather than inherit it from a
      # convenience script's side effects.
      - name: Seed the web console's build-time config
        run: |
          cat > apps/web/.env <<'EOF'
          VITE_KEYCLOAK_ISSUER=http://localhost:8080/realms/identity-manager
          VITE_KEYCLOAK_CLIENT_ID=idm-console
          VITE_API_BASE_URL=http://localhost:3000
          EOF
          cat apps/web/.env

      # Without this, every E2E request 403s: a fresh database has no local
      # `users` row and no role grant for the seeded Keycloak dev user, and
      # nothing in the UI can grant the first role (see README's "SECURITY
      # STATUS"). Playwright's login/people specs sign in as this account.
      - name: Bootstrap the local admin account
        run: pnpm bootstrap:admin

      # Typecheck (now including apps/api/scripts/) + build both packages +
      # the full 756-test API suite against disposable Testcontainers.
      - name: Verify (typecheck, build, API suite)
        run: pnpm verify

      # Against the compose stack + BOTH the API and web dev servers, which
      # Playwright starts itself (playwright.config.ts's `webServer` is an
      # array of two entries since Milestone 11, Task 6 — previously only
      # the web server, which silently depended on a human starting the API
      # by hand first; see that config's own doc comment for the full
      # history). Ports 3000/5173 are free at this point, `pnpm verify`
      # never binds them.
      - name: Playwright E2E
        run: pnpm --filter @idm/web run test:e2e
