services:
  # POSTGRES_USER here bootstraps only the OWNER/MIGRATION role (`idm`) —
  # the official Postgres image always makes it both the superuser and the
  # database owner. It is deliberately the ONLY role this compose file
  # knows about. The second, RUNTIME role the application and sync worker
  # actually connect as (see docs/02-architecture.md's "The two database roles" section and
  # docs/archive/audits/audit-integrity.md finding H1) is NOT created here —
  # it is provisioned by `pnpm --filter @idm/api db:migrate`
  # (apps/api/src/db/roles.ts), which works identically against this
  # container, a CI Postgres, or a real managed instance (RDS, Cloud SQL,
  # ...) with no docker-entrypoint-initdb.d dependency. Run db:migrate
  # after this container is up (and after every fresh volume) before
  # starting the app.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idm
      POSTGRES_PASSWORD: idm_dev_password
      POSTGRES_DB: identity_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idm -d identity_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  # THIS STACK IS FOR LOOPBACK ONLY. Both port mappings below bind every
  # interface on the host, and everything this container is configured with is
  # committed to a public repository: the bootstrap admin password on the next
  # line, and — via the realm import mounted at the bottom — a working
  # `admin@example.com` / `dev_password_change_me` account and the
  # `idm_sync_dev_secret_change_me` client secret. Exposing this to a LAN, let
  # alone the internet, hands over the identity provider the whole system
  # trusts. `start-dev` is also an ephemeral-storage, no-TLS mode that Keycloak
  # itself refuses to support in production.
  #
  # A real Keycloak is a separate, TLS-terminated instance wired up by
  # `scripts/keycloak-setup.sh`, which builds the same realm through the Admin
  # API with generated secrets and no seeded human user. See
  # keycloak/realm-import/README.md and docs/12-security.md's hardening
  # checklist. Nothing in this file should ever be pointed at one.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      # The whole directory, deliberately: `--import-realm` picks up any
      # *.json inside it, so the fixture's `.dev.json` name (finding SEC-L5)
      # costs nothing here. See keycloak/realm-import/README.md.
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro

volumes:
  pgdata:
