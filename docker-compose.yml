services:
  # POSTGRES_USER here bootstraps only the OWNER/MIGRATION role (`idm`) —
  # the official Postgres image always makes it both the superuser and the
  # database owner. It is deliberately the ONLY role this compose file
  # knows about. The second, RUNTIME role the application and sync worker
  # actually connect as (see README.md's "Database roles" section and
  # docs/superpowers/audit-integrity.md finding H1) is NOT created here —
  # it is provisioned by `pnpm --filter @idm/api db:migrate`
  # (apps/api/src/db/roles.ts), which works identically against this
  # container, a CI Postgres, or a real managed instance (RDS, Cloud SQL,
  # ...) with no docker-entrypoint-initdb.d dependency. Run db:migrate
  # after this container is up (and after every fresh volume) before
  # starting the app.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idm
      POSTGRES_PASSWORD: idm_dev_password
      POSTGRES_DB: identity_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idm -d identity_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro

volumes:
  pgdata:
