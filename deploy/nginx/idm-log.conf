# identity-manager — access-log format that omits query strings.
#
# WHY THIS FILE EXISTS AT ALL: finding CS-L3,
# docs/archive/audits/audit-client-supply-chain.md.
#
# Search terms in this product are people's names, usernames and email
# addresses, and they travel in query strings on BOTH sides of the edge:
#
#   * the console keeps its list filters in the URL — `/people?q=<term>`
#     (apps/web/src/shell/AppShell.tsx's search submit, and
#     apps/web/src/people/PeopleListPage.tsx's `setSearchParams`);
#   * the console then fetches `/api/users?search=<term>`
#     (apps/web/src/people/api.ts:54 via `buildQuery`).
#
# With nginx's stock `combined` format both land in access.log in plaintext,
# so anyone with read access to /var/log/nginx/ — an ops role that needs no
# grant in the directory itself — gets a running record of who looked up whom.
# That is authorization-relevant metadata about an identity system, kept
# outside the append-only, privilege-separated audit log that docs/12-security.md
# goes to some lengths to build.
#
# Note that stripping the console URL alone would NOT have been enough, and
# that removing `?q=` from the console URL would not have helped either: the
# XHR to /api/users?search=… carries the same term regardless of what the
# address bar says. The sanitising therefore has to be at the log, and it has
# to cover /api/ as well as /.
#
# THE REFERER MATTERS TOO, and is easy to miss. Both vhosts USED TO set
# `Referrer-Policy: same-origin`, which suppresses the referrer only on
# CROSS-origin requests and sends the FULL URL on same-origin ones — and the
# console and the API deliberately share ONE origin. So every /api/ request
# made while the address bar read `/people?q=ada.lovelace@example.com` wrote
# that term into the log a second time, in the `$http_referer` field, even
# with the request line cleaned. `$idm_log_referer` below truncates it at the
# `?` for that reason.
#
# Both vhosts now send `Referrer-Policy: no-referrer` instead (CS-L3
# residual — see the long comment beside the header in idm.conf for why
# `strict-origin-when-cross-origin` would NOT have fixed it), so the browser
# no longer sends that second copy at all. The truncation below is KEPT
# regardless, and is not redundant: it is what still holds if a future edit
# relaxes the header, and it also covers referrers this config does not
# control (a cross-origin referrer that a `no-referrer` policy on some OTHER
# site's page did not suppress). Defence at the log AND at the header —
# neither alone is the whole fix.
#
# WHAT THIS DOES NOT FIX: the terms still enter browser history, and OIDC
# still returns to `/?code=…&state=…` (that is the authorization-code flow
# working as specified, not a defect in this app — and `AuthRoot`'s
# `onSigninCallback` already clears it from history with a replacing
# navigation). What changes here is only that neither is written to disk and
# retained. The code is single-use and PKCE-bound in any case.
#
# INSTALLATION: this is http-context — `log_format` and `map` are not valid
# inside a `server` block — so it cannot live in the vhost. scripts/install.sh
# copies it to /etc/nginx/conf.d/idm-log.conf, which stock nginx.conf includes
# BEFORE sites-enabled, so `idm_noquery` is defined by the time the vhost
# references it. If you install a vhost by hand without this file, `nginx -t`
# fails with `unknown log format "idm_noquery"` — a loud failure, deliberately,
# rather than a silent fallback to logging the query strings again.

# Everything up to the first "?" — i.e. `$request_uri` minus the query string.
# `$request_uri` is the ORIGINAL request URI, which is what we want: `$uri`
# would be the post-`try_files` value, and the SPA fall-through rewrites every
# unknown console route to /index.html, so `$uri` would log /index.html for
# every page in the console.
map $request_uri $idm_log_path {
    "~^(?<idm_path_only>[^?]*)"  $idm_path_only;
    default                      "-";
}

# Same truncation for the referrer (see the note above about same-origin
# referrers carrying the console's own query string into every API request).
map $http_referer $idm_log_referer {
    ""                              "-";
    "~^(?<idm_referer_only>[^?]*)"  $idm_referer_only;
    default                         "-";
}

# `combined`, field for field, with the request line rebuilt from its parts so
# the query string can be left out, and the referrer truncated the same way.
log_format idm_noquery '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $idm_log_path $server_protocol" '
                       '$status $body_bytes_sent '
                       '"$idm_log_referer" "$http_user_agent"';
