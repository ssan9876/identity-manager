# identity-manager edge.
#
# ONE origin serves both the console and the API, deliberately. `main.ts` calls
# `app.enableCors({ origin: ['http://localhost:5173'] })` with that origin
# hardcoded, so a split-origin deployment (console on one host, API on another)
# would be refused by the browser. Serving both here means requests are
# same-origin and CORS never applies.
#
# For TLS: point certbot at this file (`certbot --nginx -d @IDM_HOSTNAME@`).
# It rewrites this server block in place and adds the :443 listener. If you do,
# rebuild the web bundle with IDM_SCHEME=https — the API base URL is compiled
# into it (see `reconfigure` in docs/05-installation.md).

server {
    listen 80;
    listen [::]:80;
    server_name @IDM_HOSTNAME@;

    # Uploads: bulk import accepts CSV. Keep a ceiling so a large body cannot
    # be used to exhaust memory — the import path materialises the file before
    # applying its own row cap.
    client_max_body_size 12m;

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:@IDM_PORT@/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Web console --------------------------------------------------------
    root @REPO_ROOT@/apps/web/dist;
    index index.html;

    # Hashed asset filenames, so they can be cached hard and immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: unknown paths are client-side routes, not 404s. index.html itself is
    # never cached, or a deploy would keep serving the old asset references.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Not a security control on its own — the API enforces authorization
    # itself — but free defence in depth for the console's own responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
