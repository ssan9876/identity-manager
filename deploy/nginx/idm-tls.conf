# identity-manager edge — TLS.
#
# Used when IDM_SCHEME=https (the default). The plain-HTTP variant is
# deploy/nginx/idm.conf, and install.sh chooses between them.
#
# WHY TLS IS NOT OPTIONAL HERE: the console signs in with oidc-client-ts,
# which computes the PKCE S256 challenge using `crypto.subtle`. Browsers only
# expose that API in a SECURE CONTEXT — https, or localhost. Over plain http
# on any other host, `crypto.subtle` is undefined, `signinRedirect()` rejects,
# and the Sign in button does nothing at all: no navigation, no error dialog.
# So port 80 redirects rather than serving a console that cannot log in.
#
# ONE origin serves both the console and the API, deliberately. `main.ts`
# calls `app.enableCors({ origin: ['http://localhost:5173'] })` with that
# origin hardcoded, so a split-origin deployment would be refused by the
# browser. Serving both here means requests are same-origin and CORS never
# applies.

server {
    listen 80;
    listen [::]:80;
    server_name @IDM_HOSTNAME@;
    # This redirect preserves the query string (`$request_uri`), and a
    # bookmarked `http://…/people?q=<name>` lands here first — so this server
    # logs one too. Same sanitised format as the TLS vhost below (CS-L3).
    access_log /var/log/nginx/access.log idm_noquery;
    return 301 https://$host$request_uri;
}

server {
    # No `http2 on;` — that is nginx 1.25+ syntax, and Ubuntu 24.04 ships
    # 1.24, which rejects the entire config with `unknown directive "http2"`.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @IDM_HOSTNAME@;

    ssl_certificate     @TLS_CERT@;
    ssl_certificate_key @TLS_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Uploads: bulk import accepts CSV. Keep a ceiling so a large body cannot
    # be used to exhaust memory — the import path materialises the file before
    # applying its own row cap.
    client_max_body_size 12m;

    # Search terms in this product are people's names and email addresses, and
    # they ride in the query string on both sides of this edge: the console's
    # own `/people?q=…` and the XHR it makes to `/api/users?search=…`. nginx's
    # stock `combined` format would write both to access.log in plaintext, and
    # a referrer-sending policy would write the console's term a second time
    # into the referer field of every API request (this vhost now sends
    # `Referrer-Policy: no-referrer`, so that second copy no longer leaves
    # the browser at all — the truncation below stays as belt-and-braces).
    # `idm_noquery` is `combined` with the query string dropped from the
    # request line and from the referrer — finding CS-L3,
    # docs/archive/audits/audit-client-supply-chain.md. The format itself is
    # defined in deploy/nginx/idm-log.conf, which install.sh puts in
    # /etc/nginx/conf.d/ because `log_format` is only valid at http level.
    # Declared at server level so it covers /api/ too, not just the console:
    # dropping `?q=` from the console URL alone would change nothing, since
    # the API request carries the same term either way.
    access_log /var/log/nginx/access.log idm_noquery;

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:@IDM_PORT@/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Web console --------------------------------------------------------
    root @REPO_ROOT@/apps/web/dist;
    index index.html;

    # Hashed asset filenames, so they can be cached hard and immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated deliberately — DO NOT fold these back into the server block.
        # ngx_http_headers_module inherits add_header from an outer level ONLY
        # if the current level defines no add_header of its own. This location
        # sets Cache-Control, so without these repeats all of the server-level
        # security headers below are silently discarded on every console
        # response, leaving the SPA with no anti-framing header at all — finding
        # CS-M1, docs/archive/audits/audit-client-supply-chain.md. `always`
        # governs error responses, not inheritance; it does not help here.
        #
        # Referrer-Policy is `no-referrer`, NOT `same-origin` — see the
        # server-level copy at the bottom of this file for why. Keep all
        # three copies identical; a value that differs per location is the
        # same silent-divergence failure CS-M1 was.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Content-Security-Policy — generated by the web build, see the
        # server-level copy at the bottom of this file. Repeated here for the
        # same inheritance reason as the four headers above.
        include @REPO_ROOT@/apps/web/dist/csp.conf;
        try_files $uri =404;
    }

    # SPA: unknown paths are client-side routes, not 404s. index.html itself is
    # never cached, or a deploy would keep serving the old asset references.
    location / {
        add_header Cache-Control "no-store";
        # Repeated deliberately — DO NOT fold these back into the server block.
        # ngx_http_headers_module inherits add_header from an outer level ONLY
        # if the current level defines no add_header of its own. This location
        # sets Cache-Control, so without these repeats all of the server-level
        # security headers below are silently discarded on every console
        # response, leaving the SPA with no anti-framing header at all — finding
        # CS-M1, docs/archive/audits/audit-client-supply-chain.md. `always`
        # governs error responses, not inheritance; it does not help here.
        #
        # Referrer-Policy is `no-referrer`, NOT `same-origin` — see the
        # server-level copy at the bottom of this file for why. Keep all
        # three copies identical; a value that differs per location is the
        # same silent-divergence failure CS-M1 was.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Content-Security-Policy — generated by the web build, see the
        # server-level copy at the bottom of this file. THIS is the copy that
        # matters most: it is the location that serves index.html, the document
        # the policy actually governs.
        include @REPO_ROOT@/apps/web/dist/csp.conf;
        try_files $uri $uri/ /index.html;
    }

    # Not a security control on its own — the API enforces authorization
    # itself — but free defence in depth. These reach ONLY /api/, the one
    # location that declares no add_header of its own and therefore still
    # inherits them; the console locations repeat them inline (CS-M1).
    #
    # WHY `no-referrer` AND NOT `same-origin`. This header used to say
    # `same-origin`, which is the value that CAUSES the leak CS-L3 is about
    # rather than preventing it: `same-origin` suppresses the referrer only
    # on CROSS-origin requests and sends the FULL URL — path AND query
    # string — on every SAME-origin one. The console and the API share one
    # origin by design (see the file header), so with the address bar
    # reading `/people?q=ada.lovelace@example.com`, every single XHR to
    # /api/... carried that person's email address in its own Referer
    # header. idm-log.conf's `$idm_log_referer` truncation stopped that
    # being WRITTEN DOWN; it could not stop it being SENT, and the header is
    # what decides that.
    #
    # Note that the two obvious-looking replacements do not fix it:
    #   * `strict-origin-when-cross-origin` (the modern browser default)
    #     still sends the full URL on same-origin requests — it only
    #     degrades to origin-only when the request crosses origins, which is
    #     exactly the case that was already safe here.
    #   * `same-origin-when-cross-origin` is not a Referrer-Policy token at
    #     all. An unrecognised token makes the browser fall back to its
    #     default policy, which is the previous bullet.
    # `strict-origin` and `origin` do remove the query string, but both send
    # the origin on CROSS-origin requests, where `same-origin` sent nothing
    # — so either would be a fix in one direction and a small regression in
    # the other.
    #
    # `no-referrer` is the only value that is at least as strict as
    # `same-origin` in every direction and strictly stricter in the one that
    # matters. Nothing in this system reads a Referer: the API authorizes
    # from the bearer token, CORS never applies (one origin), and the only
    # cross-origin navigation is the OIDC redirect to Keycloak, which is
    # driven by query parameters and PKCE, not by the referrer. Finding
    # CS-L3 residual, docs/archive/audits/audit-client-supply-chain.md.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Content-Security-Policy (finding CS-M2) ----------------------------
    #
    # The policy is NOT written here. It is GENERATED by the web build into
    # @REPO_ROOT@/apps/web/dist/csp.conf, right next to the index.html it
    # describes, and included at all three levels that declare add_header of
    # their own (same ngx_http_headers_module inheritance rule as above — a
    # single copy here would reach /api/ and nothing else, i.e. everything
    # except the document the policy is for).
    #
    # WHY GENERATED. index.html carries an inline pre-paint theme script that
    # cannot become a module (it has to run before any bundle exists), so the
    # policy has to carry that script's sha256. A hash that does not match the
    # served bytes blocks the script; a script-src mistake blocks the bundle;
    # either way the console renders nothing and the only clue is in the
    # browser console. So the hash is derived from the BUILT index.html on
    # every build and never typed by hand — apps/web/vite.config.ts plugin
    # `idm-csp`, with the reasoning in apps/web/scripts/csp.mjs and an
    # independent re-derivation in apps/web/scripts/check-csp.mjs, wired into
    # `pnpm --filter @idm/web test`.
    #
    # The same file is included by the plain-HTTP vhost, so the two never
    # diverge, and the policy carries no `upgrade-insecure-requests`: it must
    # be byte-identical under both schemes, and every URL the console loads is
    # either same-origin or the issuer's own absolute https URL already.
    #
    # CONSEQUENCE FOR OPERATORS: nginx reads this file at configuration load.
    # Rebuilding the console changes the hash; nginx keeps the OLD one until
    # it is reloaded. So `pnpm build` on this host must be followed by
    # `nginx -t && systemctl reload nginx` — docs/11-operations.md says so at
    # the rebuild step. A build that fails leaves neither index.html nor
    # csp.conf, and this include then makes `nginx -t` fail loudly rather than
    # letting a stale policy be served against a new page.
    include @REPO_ROOT@/apps/web/dist/csp.conf;
}
